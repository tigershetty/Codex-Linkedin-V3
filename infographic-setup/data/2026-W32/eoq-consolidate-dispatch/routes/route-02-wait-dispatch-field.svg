<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Rough route study: wait versus dispatch diagnostic field</title>
  <desc id="desc">An original low-fidelity diagnostic field for a future working infographic. It is not a final social visual.</desc>
  <rect width="1080" height="1350" fill="#FAFAF7"/>
  <text x="64" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#4A4A46">ROUTE STUDY 02 / TRADE-OFF FIELD / NOT A FINAL VISUAL</text>
  <text x="64" y="154" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#101113">When does waiting</text>
  <text x="64" y="225" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#101113">stop making sense?</text>
  <text x="64" y="270" font-family="Arial, sans-serif" font-size="25" fill="#4A4A46">A diagnostic for the wait / combine / dispatch call — not a numerical recommendation.</text>

  <g transform="translate(64 334)">
    <rect x="0" y="0" width="952" height="676" rx="18" fill="#FFF" stroke="#101113" stroke-width="3"/>
    <line x1="476" x2="476" y1="54" y2="620" stroke="#101113" stroke-width="3"/>
    <line x1="54" x2="898" y1="337" y2="337" stroke="#101113" stroke-width="3"/>
    <path d="M476 620 L467 604 L485 604 Z" fill="#101113"/>
    <path d="M898 337 L882 328 L882 346 Z" fill="#101113"/>
    <text x="476" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#101113">MORE SERVICE SLACK  →</text>
    <text x="-338" y="-20" transform="rotate(-90)" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#101113">MORE CONSOLIDATION UPSIDE  →</text>

    <rect x="70" y="74" width="355" height="218" rx="15" fill="#FCE5DE"/>
    <text x="94" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#A33B2A">TIGHT DATE + MATERIAL UPSIDE</text>
    <text x="94" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#101113">Test recovery.</text>
    <text x="94" y="202" font-family="Arial, sans-serif" font-size="24" fill="#101113">Do not turn a rate break</text>
    <text x="94" y="233" font-family="Arial, sans-serif" font-size="24" fill="#101113">into a broken promise.</text>
    <text x="94" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#A33B2A">Need: exact latest-safe dispatch</text>

    <rect x="527" y="74" width="355" height="218" rx="15" fill="#DDF0ED"/>
    <text x="551" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#08766F">SLACK + MATERIAL UPSIDE</text>
    <text x="551" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#101113">Consolidate candidate.</text>
    <text x="551" y="202" font-family="Arial, sans-serif" font-size="24" fill="#101113">Quantify the upside and</text>
    <text x="551" y="233" font-family="Arial, sans-serif" font-size="24" fill="#101113">set the release line.</text>
    <text x="551" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08766F">Need: rate, dwell, compatible demand</text>

    <rect x="70" y="384" width="355" height="218" rx="15" fill="#F2EFD7"/>
    <text x="94" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#826B00">TIGHT DATE + LITTLE UPSIDE</text>
    <text x="94" y="475" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#101113">Dispatch candidate.</text>
    <text x="94" y="512" font-family="Arial, sans-serif" font-size="24" fill="#101113">There is little reason to</text>
    <text x="94" y="543" font-family="Arial, sans-serif" font-size="24" fill="#101113">spend the remaining slack.</text>
    <text x="94" y="580" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#826B00">Need: reliable availability + transit</text>

    <rect x="527" y="384" width="355" height="218" rx="15" fill="#E7EAF0"/>
    <text x="551" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#47556B">SLACK + LITTLE UPSIDE</text>
    <text x="551" y="475" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#101113">Normal cadence.</text>
    <text x="551" y="512" font-family="Arial, sans-serif" font-size="24" fill="#101113">Do not manufacture a</text>
    <text x="551" y="543" font-family="Arial, sans-serif" font-size="24" fill="#101113">special shipment decision.</text>
    <text x="551" y="580" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#47556B">Need: still check quantity policy</text>
  </g>

  <g transform="translate(64 1062)">
    <rect width="952" height="174" rx="16" fill="#101113"/>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#F5F1EA">SEPARATE CHECK: QUANTITY POLICY</text>
    <text x="30" y="89" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#F5F1EA">EOQ / MOQ may define an order size.</text>
    <text x="30" y="126" font-family="Arial, sans-serif" font-size="25" fill="#F5F1EA">They do not tell you which quadrant you are in — the customer constraint does.</text>
    <line x1="30" x2="920" y1="145" y2="145" stroke="#6FC8C1" stroke-width="3"/>
  </g>
  <text x="64" y="1292" font-family="Arial, sans-serif" font-size="19" fill="#4A4A46">Inputs are local: need-by, availability, transit reliability, compatible orders, handling and rate effects.</text>
</svg>
