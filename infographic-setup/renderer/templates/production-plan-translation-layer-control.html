<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Plan Translation Layer — Control</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root {
    --paper: #f7faff;
    --paper-2: #eef5ff;
    --ink: #061f53;
    --blue: #116ff0;
    --green: #15945f;
    --coral: #dd4b24;
    --line: rgba(6, 31, 83, .24);
    --soft: rgba(17, 111, 240, .10);
    --sans: "Poppins", Arial, sans-serif;
    --mono: "JetBrains Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #d8e2f1;
  }

  #card {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--sans);
    background:
      linear-gradient(rgba(17,111,240,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,111,240,.035) 1px, transparent 1px),
      radial-gradient(circle at 60% 36%, rgba(17,111,240,.10), transparent 28%),
      var(--paper);
    background-size: 26px 26px, 26px 26px, auto, auto;
  }

  .header {
    position: absolute;
    left: 70px;
    right: 70px;
    top: 52px;
  }

  h1 {
    margin: 0;
    font-size: 78px;
    line-height: .95;
    letter-spacing: 0;
    font-weight: 900;
  }

  h1 span {
    display: block;
    color: var(--blue);
  }

  .sub {
    margin-top: 18px;
    font-size: 25px;
    line-height: 1.24;
    font-weight: 700;
  }

  .stage {
    position: absolute;
    left: 60px;
    right: 60px;
    top: 250px;
    height: 900px;
  }

  .rail {
    position: absolute;
    left: 88px;
    right: 110px;
    top: 430px;
    height: 18px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), rgba(17,111,240,.32));
    box-shadow: 0 0 0 6px rgba(17,111,240,.08);
  }

  .rail::after {
    content: "";
    position: absolute;
    right: -20px;
    top: -9px;
    border-left: 28px solid var(--blue);
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
  }

  .stack,
  .gate,
  .plan,
  .schedule {
    position: absolute;
    border: 2px solid rgba(17,111,240,.38);
    background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(235,246,255,.70));
    box-shadow: 0 22px 54px rgba(6,31,83,.12);
  }

  .stack {
    left: 0;
    top: 126px;
    width: 198px;
    height: 430px;
    border-radius: 18px;
    padding: 22px;
  }

  .cap {
    display: grid;
    place-items: center;
    min-height: 56px;
    padding: 8px;
    color: #fff;
    background: var(--ink);
    border-radius: 10px;
    font-size: 20px;
    line-height: 1.05;
    text-align: center;
    font-weight: 900;
  }

  .tile {
    margin-top: 18px;
    height: 130px;
    border-radius: 14px;
    background: rgba(17,111,240,.08);
    border: 1px solid var(--line);
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 12px;
    font-size: 21px;
    font-weight: 900;
  }

  .icon {
    width: 50px;
    height: 42px;
    position: relative;
  }

  .icon.orders::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 8px;
    width: 34px;
    height: 22px;
    border: 5px solid var(--ink);
    border-top: 0;
    transform: skewX(-12deg);
  }

  .icon.orders::after {
    content: "";
    position: absolute;
    left: 13px;
    bottom: 1px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 22px 0 0 var(--ink);
  }

  .icon.forecast {
    display: flex;
    align-items: end;
    gap: 6px;
  }

  .icon.forecast i {
    width: 9px;
    background: var(--ink);
    border-radius: 3px 3px 0 0;
  }

  .icon.forecast i:nth-child(1) { height: 16px; }
  .icon.forecast i:nth-child(2) { height: 25px; }
  .icon.forecast i:nth-child(3) { height: 33px; }
  .icon.forecast i:nth-child(4) { height: 40px; }

  .gate {
    left: 235px;
    top: 62px;
    width: 270px;
    height: 560px;
    border-radius: 22px;
    padding: 22px;
  }

  .gate-item {
    position: relative;
    height: 115px;
    margin-bottom: 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.72);
    display: grid;
    grid-template-columns: 54px 1fr 26px;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
    font-size: 20px;
    font-weight: 900;
  }

  .glyph {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 5px solid var(--ink);
    opacity: .92;
  }

  .status {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--green);
  }

  .status.warn { background: var(--coral); }

  .tradeoff {
    position: absolute;
    left: 520px;
    top: 160px;
    width: 84px;
    height: 340px;
    border: 2px solid rgba(6,31,83,.16);
    border-radius: 18px;
    background: rgba(255,255,255,.62);
    display: grid;
    align-content: center;
    gap: 34px;
    padding: 24px;
  }

  .slider {
    height: 6px;
    border-radius: 999px;
    background: rgba(6,31,83,.26);
  }

  .slider::after {
    content: "";
    display: block;
    width: 20px;
    height: 20px;
    margin-top: -7px;
    margin-left: 44px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 5px 12px rgba(6,31,83,.20);
  }

  .plan {
    left: 620px;
    top: 74px;
    width: 190px;
    height: 500px;
    border-radius: 22px;
    padding: 24px 20px;
  }

  .mini-chart {
    margin: 20px auto 22px;
    width: 132px;
    height: 170px;
    border-left: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    background:
      linear-gradient(90deg, transparent 0 18%, rgba(17,111,240,.20) 18% 32%, transparent 32% 45%, rgba(17,111,240,.20) 45% 60%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(6,31,83,.08) 31px 33px);
  }

  .bars {
    display: grid;
    gap: 9px;
    padding-top: 16px;
  }

  .bar {
    height: 15px;
    background: linear-gradient(90deg, var(--blue) 0 72%, rgba(17,111,240,.18) 72%);
    border-radius: 999px;
  }

  .bar:nth-child(2) { background: linear-gradient(90deg, var(--green) 0 52%, rgba(21,148,95,.16) 52%); }
  .bar:nth-child(3) { background: linear-gradient(90deg, var(--coral) 0 38%, rgba(221,75,36,.16) 38%); }

  .commit {
    margin-top: 24px;
    border-radius: 16px;
    padding: 20px 14px;
    background: rgba(17,111,240,.08);
    border: 1px solid var(--line);
    text-align: center;
    font-size: 21px;
    line-height: 1.08;
    font-weight: 900;
  }

  .schedule {
    right: 0;
    top: 120px;
    width: 146px;
    height: 498px;
    border-radius: 18px;
    padding: 20px 16px;
  }

  .slot {
    height: 48px;
    margin-top: 13px;
    border-radius: 10px;
    background:
      linear-gradient(90deg, var(--blue) 0 66%, rgba(6,31,83,.12) 66%),
      var(--paper-2);
    border: 1px solid rgba(6,31,83,.14);
  }

  .schedule .cap,
  .plan .cap {
    font-size: 17px;
  }

  .slot:nth-child(5) { background: linear-gradient(90deg, var(--green) 0 52%, rgba(6,31,83,.12) 52%); }
  .slot:nth-child(7) { background: linear-gradient(90deg, var(--coral) 0 28%, rgba(6,31,83,.12) 28%); }

  .feedback {
    position: absolute;
    left: 60px;
    right: 70px;
    top: 650px;
    height: 150px;
    border-radius: 20px;
    border: 2px solid rgba(21,148,95,.40);
    background: linear-gradient(90deg, rgba(21,148,95,.10), rgba(255,255,255,.70));
    display: grid;
    grid-template-columns: 1fr 190px 1fr;
    align-items: center;
    gap: 22px;
    padding: 22px 28px;
    box-shadow: 0 18px 44px rgba(6,31,83,.08);
  }

  .pipe {
    height: 12px;
    border-radius: 999px;
    background: var(--green);
    opacity: .68;
  }

  .feedback .label {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
  }

  .dots {
    position: absolute;
    left: 88px;
    right: 88px;
    bottom: 112px;
    height: 1px;
    background: rgba(6,31,83,.16);
  }

  .logo {
    position: absolute;
    left: 420px;
    bottom: 28px;
    width: 240px;
    height: 120px;
    object-fit: contain;
  }
</style>
</head>
<body>
  <main id="card">
    <section class="header">
      <h1>PRODUCTION PLAN <span>TRANSLATION LAYER</span></h1>
      <div class="sub">Demand ambition becomes factory commitment after constraints are checked.</div>
    </section>

    <section class="stage">
      <div class="rail"></div>

      <div class="stack">
        <div class="cap">DEMAND PLAN</div>
        <div class="tile">
          <div class="icon orders"></div>
          <div>ORDERS</div>
        </div>
        <div class="tile">
          <div class="icon forecast"><i></i><i></i><i></i><i></i></div>
          <div>FORECAST</div>
        </div>
      </div>

      <div class="gate">
        <div class="gate-item"><div class="glyph"></div><div>CAPACITY</div><div class="status"></div></div>
        <div class="gate-item"><div class="glyph"></div><div>MATERIALS</div><div class="status"></div></div>
        <div class="gate-item"><div class="glyph"></div><div>LABOR</div><div class="status warn"></div></div>
        <div class="gate-item"><div class="glyph"></div><div>CHANGEOVERS</div><div class="status warn"></div></div>
      </div>

      <div class="tradeoff">
        <div class="slider"></div>
        <div class="slider"></div>
        <div class="slider"></div>
        <div class="slider"></div>
      </div>

      <div class="plan">
        <div class="cap">PRODUCTION PLAN</div>
        <div class="mini-chart">
          <div class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <div class="commit">BUILD<br>COMMITMENT</div>
      </div>

      <div class="schedule">
        <div class="cap">FACTORY<br>SCHEDULE</div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>

      <div class="feedback">
        <div class="pipe"></div>
        <div class="label">FEEDBACK</div>
        <div class="pipe"></div>
      </div>
    </section>

    <div class="dots"></div>
    <img class="logo" src="../assets/logos/shettys-desk-logo-2.png" alt="Shetty's Desk">
  </main>
</body>
</html>
